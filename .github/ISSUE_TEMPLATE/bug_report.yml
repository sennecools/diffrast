name: Bug report
description: Something produces wrong results, crashes, or fails to install.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `python -c "import torch, diffrast; print(diffrast.__version__, torch.__version__, torch.version.cuda, torch.version.hip)"`, plus your GPU model and OS.
      render: text
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - triton
        - reference
        - not sure
    validations:
      required: true
