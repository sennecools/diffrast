[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "diffrast"
dynamic = ["version"]
description = "Portable differentiable mesh rasterization for PyTorch on AMD and NVIDIA GPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Senne Cools" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
keywords = [
    "differentiable-rendering",
    "rasterization",
    "pytorch",
    "triton",
    "rocm",
    "3d",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sennecools/diffrast"
Issues = "https://github.com/sennecools/diffrast/issues"
Changelog = "https://github.com/sennecools/diffrast/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.5"]
examples = ["numpy>=1.24", "pillow>=10.1"]

[tool.hatch.version]
path = "src/diffrast/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "benchmarks", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["gpu: requires a CUDA or ROCm device"]
